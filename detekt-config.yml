build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  LongMethod:
    threshold: 80
    ignoreAnnotated: ['Composable']
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    threshold: 15
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 25

style:
  MaxLineLength:
    maxLineLength: 150
  MagicNumber:
    active: false
  ReturnCount:
    max: 4
  ForbiddenComment:
    active: false
  WildcardImport:
    active: false

naming:
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9_]*'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Z0-9_]*'

exceptions:
  TooGenericExceptionCaught:
    active: false
