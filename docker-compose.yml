services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: mcp_password_change_me
      POSTGRES_DB: mcp_ai_chat
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://mcp:mcp_password_change_me@db:5432/mcp_ai_chat?schema=public
      AUTH_SECRET: change-me-generate-openssl-rand-base64-32
      AUTH_URL: http://localhost:3000
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    env_file: [.env]

volumes:
  pgdata:
