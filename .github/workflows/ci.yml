name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Copy .env.example to .env
      run: cp .env.example .env

    - name: Run Detekt
      run: ./gradlew detekt

    - name: Check Code Formatting
      run: ./gradlew spotlessCheck

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest -PscreenshotTests=true

    - name: Check Lint
      run: ./gradlew lintDebug

    - name: Check for Hardcoded Secrets
      run: |
        if grep -r "AIza" app/src/main/ --include="*.kt" --include="*.xml"; then
          echo "ERROR: Potential API key found in source code"
          exit 1
        fi
        if grep -r "sk_" app/src/main/ --include="*.kt" --include="*.xml"; then
          echo "ERROR: Potential secret key found in source code"
          exit 1
        fi
