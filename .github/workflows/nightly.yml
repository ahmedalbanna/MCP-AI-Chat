name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC daily
  workflow_dispatch:

jobs:
  nightly-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Copy .env.example to .env
      run: cp .env.example .env

    - name: Run Detekt
      run: ./gradlew detekt

    - name: Check Code Formatting
      run: ./gradlew spotlessCheck

    - name: Run Unit Tests (with screenshots)
      run: ./gradlew testDebugUnitTest -PscreenshotTests=true

    - name: Validate Room migrations
      run: ./gradlew testDebugUnitTest --tests "*DatabaseMigrationTest*"

    - name: Check Lint
      run: ./gradlew lintDebug

    - name: Check for Hardcoded Secrets (gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Enforce coverage gate
      run: ./gradlew koverVerify

    - name: Upload nightly results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nightly-results
        path: |
          app/build/reports/tests/
          app/build/reports/lint-results-debug.html
          app/build/reports/detekt/
        retention-days: 14
